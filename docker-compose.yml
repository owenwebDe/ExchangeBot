version: '3.8'

services:
  exchange-bot:
    build: .
    container_name: exchange-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - DEFAULT_CHANNEL=${DEFAULT_CHANNEL}
      - BASE_URL=${BASE_URL}
      - PORT=3000
    volumes:
      # Mount database to persist data
      - ./data:/app/data
      # Mount logs
      - ./logs:/app/logs
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
