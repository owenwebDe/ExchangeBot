# fly.toml app configuration file
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "exchangebot"
primary_region = "sea"

[build]
  [build.args]
    NODE_VERSION = "18"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  DATA_DIR = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[mounts]
  source = "data"
  destination = "/app/data"
